[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "civil-runtime"
version = "0.0.0"
description = "Executes Civil graph manifests. A dependency of every Civil project."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "anthropic>=0.40",
    "jsonschema>=4.23",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "ruff>=0.8"]

[tool.hatch.build.targets.wheel]
packages = ["src/civil_runtime"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
